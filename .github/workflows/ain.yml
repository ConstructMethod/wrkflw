name: "یوتیوب دانلودر نهایی"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp
          
      - name: دانلود ویدیو
        run: |
          # دانلود با اسم ثابت و مشخص
          yt-dlp "${{ github.event.inputs.video_url }}" \
            -o "downloaded_video.mp4" \
            -f "best[ext=mp4]" || \
          yt-dlp "${{ github.event.inputs.video_url }}" \
            -o "downloaded_video.mp4"
          
          # چک کن فایل ساخته شده یا نه
          ls -la
          echo "فایل‌های موجود:"
          ls -la *.mp4 || echo "فایل mp4 پیدا نشد"
          
      - name: آپلود به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-youtube-video
          path: |
            downloaded_video.mp4
            *.mp4
            *.webm
            *.mkv
