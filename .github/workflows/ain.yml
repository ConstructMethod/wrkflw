name: "YT Downloader with Debug"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp
          
      - name: Test download (with full error)
        run: |
          # این خط رو اضافه کردم تا خطا رو کامل نشون بده
          set -e
          echo "لینک وارد شده: ${{ github.event.inputs.video_url }}"
          echo "شروع تست..."
          
          # با گزینه --verbose خطای کامل رو میبینی
          yt-dlp "${{ github.event.inputs.video_url }}" \
            -o "video.mp4" \
            --verbose
          
      - name: Upload if success
        uses: actions/upload-artifact@v4
        with:
          name: my-video
          path: video.mp4
