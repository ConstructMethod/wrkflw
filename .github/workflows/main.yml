name: خفن ترین Release Downloader

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'آدرس ریپو (مثل tailscale/tailscale)'
        required: true
        type: string
      version:
        description: 'تگ یا latest'
        required: true
        type: string
        default: 'latest'
      file_filter:
        description: 'اسم فایل یا الگو (*.apk, *.zip, *)'
        required: true
        type: string
        default: '*'

jobs:
  super_downloader:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: چک اوت ریپو
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: دانلود با قدرت الهی
        uses: robinraju/release-downloader@v1.11
        id: downloader
        with:
          repository: ${{ github.event.inputs.repo_url }}
          tag: ${{ github.event.inputs.version }}
          fileName: ${{ github.event.inputs.file_filter }}
          out-file-path: 'downloaded_files'
          extract: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: نمایش اطلاعات دانلود شده
        run: |
          echo "🔥 تگی که دانلود شد: ${{ steps.downloader.outputs.tag_name }}"
          echo "📂 فایل‌های دانلود شده:"
          ls -la downloaded_files/
          echo "📊 تعداد فایل‌ها: $(ls -1 downloaded_files/ | wc -l)"

      - name: انتقال فایل‌ها به ریپو
        run: |
          TAG="${{ steps.downloader.outputs.tag_name }}"
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          
          mkdir -p "releases/$TAG"
          
          for file in downloaded_files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              cp "$file" "releases/$TAG/${TIMESTAMP}_${filename}"
            fi
          done
          
          echo "✅ فایل‌ها کپی شدن به releases/$TAG/"

      - name: کانفیگ گیت
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: کامیت و پوش کردن به ریپو
        run: |
          git add releases/
          git commit -m "دانلود خودکار: ${{ steps.downloader.outputs.tag_name }} از ${{ github.event.inputs.repo_url }}" || echo "هیچی برای کامیت نیست"
          git push origin main || git push origin master

      - name: نمایش لینک دانلود مستقیم
        run: |
          TAG="${{ steps.downloader.outputs.tag_name }}"
          echo "🎯 فایل‌ها توی ریپو ذخیره شدن:"
          echo "📁 releases/$TAG/"
          echo ""
          echo "🔗 لینک‌های دانلود مستقیم (بدون تحریم):"
          
          for file in releases/$TAG/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "https://raw.githubusercontent.com/${{ github.repository }}/main/releases/$TAG/$filename"
            fi
          done