name: Release Downloader

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'ادس ریپوسیتوری (مثل username/repo)'
        required: true
        type: string
      tag:
        description: 'تگ نسخه (مثل v1.0.0 یا latest)'
        required: true
        type: string
        default: 'latest'
      file_pattern:
        description: 'اسم فایل یا الگو (مثل *.zip, app.apk, یا * برای همه)'
        required: true
        type: string
        default: '*'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: get_release
        run: |
          REPO="${{ github.event.inputs.repo_url }}"
          TAG="${{ github.event.inputs.tag }}"
          
          if [ "$TAG" = "latest" ]; then
            URL="https://api.github.com/repos/${REPO}/releases/latest"
          else
            URL="https://api.github.com/repos/${REPO}/releases/tags/${TAG}"
          fi
          
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" $URL)
          
          if [ "$TAG" = "latest" ]; then
            ACTUAL_TAG=$(echo $RESPONSE | jq -r .tag_name)
          else
            ACTUAL_TAG="$TAG"
          fi
          
          echo "tag_name=$ACTUAL_TAG" >> $GITHUB_OUTPUT
          
          echo "📦 ریلیز پیدا شد: $ACTUAL_TAG"
          
          echo "$RESPONSE" > release.json
          
          echo "📄 فایل‌های موجود:"
          echo "$RESPONSE" | jq -r '.assets[] | "   🔹 " + .name + " (" + (.size | tostring) + " bytes)"'

      - name: Download files
        uses: robinraju/release-downloader@v1.10
        with:
          repository: ${{ github.event.inputs.repo_url }}
          tag: ${{ steps.get_release.outputs.tag_name }}
          fileName: ${{ github.event.inputs.file_pattern }}
          out-file-path: 'downloaded'
          extract: false

      - name: List downloaded files
        run: |
          echo "✨ فایل‌های دانلود شده:"
          ls -la downloaded/
          echo "📁 تعداد فایل‌ها: $(ls -1 downloaded/ | wc -l)"

      - name: Upload to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ steps.get_release.outputs.tag_name }}
          path: downloaded/
          retention-days: 7