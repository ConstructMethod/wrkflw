name: دانلود اپ رسمی دیپ‌سیک

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: نصب apkeep
        run: |
          curl -LO https://github.com/Kajaqq/apkeep/releases/download/0.16.0/apkeep-x86_64-unknown-linux-gnu.tar.gz
          tar xzf apkeep-x86_64-unknown-linux-gnu.tar.gz
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: دانلود DeepSeek از APKPure
        run: |
          mkdir -p downloads
          apkeep -a com.deepseek.chat -d apk-pure downloads/

      - name: ذخیره در ریپو
        run: |
          mkdir -p "android-apps"
          cp downloads/*.apk "android-apps/DeepSeek_official.apk"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-apps/
          git commit -m "دانلود اپ رسمی DeepSeek" || echo "no changes"
          git push origin main || git push origin master