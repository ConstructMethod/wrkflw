name: APK Downloader (APKPure Direct)

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (مثل com.deepseek.chat)'
        required: true
        type: string

jobs:
  download_apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Download APK with APKPure Direct Link
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          # استفاده از لینک مستقیم APKPure
          DIRECT_URL="https://d.apkpure.net/b/APK/${PACKAGE}?version=latest"
          
          echo "🔗 Downloading from: $DIRECT_URL"
          echo "📦 Package: $PACKAGE"
          
          mkdir -p downloads
          
          # امتحان با curl و User-Agent موبایل
          curl -L \
            -H "User-Agent: Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36" \
            -H "Accept: */*" \
            -o "downloads/${PACKAGE}.apk" \
            "$DIRECT_URL"
          
          # بررسی حجم فایل
          if [ -f "downloads/${PACKAGE}.apk" ] && [ -s "downloads/${PACKAGE}.apk" ]; then
            SIZE=$(du -h "downloads/${PACKAGE}.apk" | cut -f1)
            echo "✅ Download successful! Size: $SIZE"
          else
            echo "❌ Download failed or empty file"
            exit 1
          fi
          
          ls -la downloads/
      
      - name: Save to repo
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          PACKAGE="${{ github.event.inputs.package_name }}"
          mkdir -p "apk-files"
          
          cp "downloads/${PACKAGE}.apk" "apk-files/${TIMESTAMP}_${PACKAGE}.apk"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk-files/
          git commit -m "Add APK: ${PACKAGE}" || echo "No changes to commit"
          git push origin main || git push origin master
      
      - name: Show download link
        run: |
          echo "🔗 لینک مستقیم دانلود از ریپو:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/main/apk-files/$(ls apk-files/)"