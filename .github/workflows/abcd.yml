name: "Release Downloader with Selection"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'ریپازیتوری مقصد (مثال: owner/repo)'
        required: true
        default: 'facebook/react'
      release_tag:
        description: 'Tag ریلیز (خالی بذار = نمایش لیست)'
        required: false
        default: ''
      file_pattern:
        description: 'الگوی فایل (مثلاً *.zip یا *.exe)'
        required: true
        default: '*.zip'

jobs:
  list-releases:
    runs-on: ubuntu-latest
    outputs:
      release_list: ${{ steps.get_releases.outputs.release_list }}
      release_count: ${{ steps.get_releases.outputs.release_count }}
      
    steps:
      - name: دریافت لیست Release‌ها
        id: get_releases
        run: |
          REPO="${{ github.event.inputs.repository }}"
          
          # دریافت لیست Release از API گیت‌هاب
          curl -s "https://api.github.com/repos/${REPO}/releases?per_page=30" | \
            jq -r '.[] | "\(.tag_name) | \(.name // .tag_name) | \(.published_at)"' > releases.txt
          
          echo "📦 لیست Release‌های موجود:"
          cat releases.txt
          echo "-----------------------------------"
          
          COUNT=$(cat releases.txt | wc -l)
          echo "release_count=$COUNT" >> $GITHUB_OUTPUT
          
          # ذخیره به عنوان Artifact برای مشاهده
          cat releases.txt > releases_list.txt
          
      - name: آپلود لیست Release‌ها
        uses: actions/upload-artifact@v4
        with:
          name: releases-list
          path: releases_list.txt
          retention-days: 1

  download-selected:
    runs-on: ubuntu-latest
    needs: list-releases
    if: github.event.inputs.release_tag != ''
    
    steps:
      - name: نمایش اطلاعات دانلود
        run: |
          echo "🎯 در حال دانلود از ریلیز: ${{ github.event.inputs.release_tag }}"
          echo "📁 ریپازیتوری: ${{ github.event.inputs.repository }}"
          echo "🔍 الگوی فایل: ${{ github.event.inputs.file_pattern }}"
          
      - name: دانلود فایل‌ها
        id: downloader
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ${{ github.event.inputs.repository }}
          tag: ${{ github.event.inputs.release_tag }}
          fileName: ${{ github.event.inputs.file_pattern }}
          out-file-path: 'downloaded-files'
          extract: false
          
      - name: نمایش فایل‌های دانلود شده
        run: |
          echo "✅ فایل‌های دانلود شده:"
          ls -la downloaded-files/
          echo "-----------------------------------"
          echo "Tag استفاده شده: ${{ steps.downloader.outputs.tag_name }}"
          echo "اسم Release: ${{ steps.downloader.outputs.release_name }}"
          
      - name: آپلود به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.release_tag }}-files
          path: downloaded-files/
          retention-days: 7
          
  no-tag-warning:
    runs-on: ubuntu-latest
    needs: list-releases
    if: github.event.inputs.release_tag == ''
    steps:
      - name: ⚠️ راهنمایی
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  شما Tag ریلیز را وارد نکرده‌اید!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📋 لیست Release‌های موجود در فایل Artifact ذخیره شده:"
          echo "   → اسم فایل: releases-list.zip"
          echo ""
          echo "🔍 برای دانلود، دوباره اجرا کن و این مقادیر رو وارد کن:"
          echo "   1. repository: ${{ github.event.inputs.repository }}"
          echo "   2. release_tag: [یکی از Tagهای بالا]"
          echo "   3. file_pattern: ${{ github.event.inputs.file_pattern }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
      - name: آپلود لیست Release‌ها
        uses: actions/upload-artifact@v4
        with:
          name: releases-list-help
          path: releases_list.txt