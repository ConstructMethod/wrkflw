name: "دانلود مستقیم از Release"

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'لینک مستقیم Release (مثال: https://github.com/owner/repo/releases/tag/v1.0.0)'
        required: true
      file_pattern:
        description: 'الگوی فایل (مثلاً *.zip یا *.exe یا * برای همه)'
        required: true
        default: '*'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: استخراج اطلاعات از لینک
        id: parse
        run: |
          URL="${{ github.event.inputs.release_url }}"
          
          # استخراج owner/repo از لینک
          REPO=$(echo "$URL" | sed -n 's|https://github.com/\([^/]*/[^/]*\)/releases/.*|\1|p')
          # استخراج tag از لینک
          TAG=$(echo "$URL" | sed -n 's|.*/releases/tag/\(.*\)$|\1|p')
          
          echo "repository=$REPO" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          echo "📦 ریپازیتوری: $REPO"
          echo "🏷️ Tag: $TAG"
          
      - name: دانلود فایل‌ها
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ${{ steps.parse.outputs.repository }}
          tag: ${{ steps.parse.outputs.tag }}
          fileName: ${{ github.event.inputs.file_pattern }}
          out-file-path: 'downloads'
          
      - name: آپلود به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: downloads/
          retention-days: 7