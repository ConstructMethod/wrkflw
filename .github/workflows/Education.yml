name: "YouTube Downloader - Working"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
        default: 'https://youtu.be/jNQXAC9IVRw'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: نصب ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: نصب yt-dlp با روش جایگزین
        run: |
          # دانلود فایل اجرایی مستقیم
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
      - name: تست نصب
        run: /usr/local/bin/yt-dlp --version
        
      - name: دانلود ویدیو
        run: |
          mkdir -p downloads
          cd downloads
          /usr/local/bin/yt-dlp "${{ github.event.inputs.url }}" -o "video.%(ext)s"
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/          echo "فایل دانلود شده:"
          ls -la
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/
