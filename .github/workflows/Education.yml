name: "Ye Downloader - Safe Mode"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو یا پلی‌لیست'
        required: true
      max_duration:
        description: 'حداکثر مدت ویدیو (ثانیه) - پیشنهاد 600 برای ویدیوهای کوتاه'
        required: false
        default: '600'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: نصب yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp --upgrade
          
      - name: دانلود ویدیو (با تنظیمات ایمن)
        run: |
          mkdir -p downloads
          
          yt-dlp "${{ github.event.inputs.url }}" \
            -o "downloads/%(title)s.%(ext)s" \
            --format "best[height<=720]" \
            --limit-rate 1.5M \
            --sleep-interval 5 \
            --max-duration ${{ github.event.inputs.max_duration }} \
            --no-mtime \
            --retries 3 \
            --fragment-retries 3
          
          echo "✅ دانلود کامل شد"
          ls -la downloads/
          
      - name: آپلود به Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/
          retention-days: 3
