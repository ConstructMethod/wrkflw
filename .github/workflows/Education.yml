name: "YouTube Downloader - Test"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
        default: 'https://youtu.be/jNQXAC9IVRw'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: نصب کامل yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg
          python3 -m pip install --upgrade pip
          python3 -m pip install yt-dlp
          yt-dlp --version  # چک کردن نصب
          
      - name: دانلود ویدیو
        run: |
          mkdir -p downloads
          cd downloads
          
          yt-dlp "${{ github.event.inputs.url }}" \
            -o "video.%(ext)s" \
            --no-check-certificate \
            --no-warnings
          
          echo "فایل‌های دانلود شده:"
          ls -la
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
