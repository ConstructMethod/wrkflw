name: "Download with youtube-dl"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: نصب youtube-dl
        run: |
          sudo apt-get update
          sudo apt-get install -y youtube-dl ffmpeg
          
      - name: دانلود ویدیو
        run: |
          mkdir downloads
          youtube-dl "${{ github.event.inputs.url }}" \
            -o "downloads/video.%(ext)s"
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: downloads/
