name: "Simple YouTube Downloader - No Docker"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
        default: 'https://youtu.be/jNQXAC9IVRw'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: نصب yt-dlp مستقیم
        run: |
          # نصب ffmpeg
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          # نصب yt-dlp با pip
          pip install yt-dlp
          
          # تایید نصب
          yt-dlp --version
          
      - name: دانلود ویدیو
        run: |
          mkdir -p downloads
          cd downloads
          yt-dlp "${{ github.event.inputs.url }}" \
            --output "video.%(ext)s" \
            --format "worst" \
            --no-playlist
          
          echo "فایل دانلود شده:"
          ls -la
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video
          path: downloads/
