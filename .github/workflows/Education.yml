name: "YouTube Downloader with Docker"

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    container:
      image: colinianking/yt-dlp:latest
      
    steps:
      - name: دانلود
        run: |
          yt-dlp "${{ github.event.inputs.url }}" -o "video.%(ext)s"
          
      - name: آپلود
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.*
